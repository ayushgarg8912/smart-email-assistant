spring.application.name=smart-email-assistant

# Render (and most PaaS hosts) inject PORT; locally it defaults to 8080.
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Spring AI — OpenAI-compatible chat model.
# Configuration comes ONLY from environment variables; no real key is ever
# committed to the repository.
#
#   OPENAI_API_KEY   (required for the AI endpoints)
#   OPENAI_BASE_URL  (optional) base URL of an OpenAI-compatible endpoint.
#                    Defaults to OpenAI. For Groq use:
#                    https://api.groq.com/openai/v1
#   AI_MODEL         (optional) model name. Defaults to gpt-4o-mini.
#                    For Groq use: llama-3.3-70b-versatile
#
# The base URL is expected to END at the API version segment (…/v1) and the
# completions path is /chat/completions, so both OpenAI and Groq work with the
# same shape of URL.
# ---------------------------------------------------------------------------
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured-placeholder}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.7

logging.level.org.springframework.ai=INFO
